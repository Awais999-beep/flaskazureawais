<!-- app/templates/index.html -->
{% extends "base.html" %}

{% block title %}Image Upload{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body text-center">
                <h1 class="card-title mb-4">Upload an Image</h1>
                
                {% if current_user.is_anonymous %}
                <div class="alert alert-info">
                    <p>Please <a href="{{ url_for('auth.login') }}">login</a> to upload images</p>
                </div>
                {% else %}
                <form action="{{ url_for('main.upload_file') }}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="file" class="form-label">Select an image file</label>
                        <input type="file" class="form-control" id="file" name="file" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Upload</button>
                </form>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
