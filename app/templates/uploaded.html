<!-- app/templates/uploaded.html -->
{% extends "base.html" %}

{% block title %}Upload Successful{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-body text-center">
                <h1 class="card-title mb-4">Upload Successful</h1>
                <div class="alert alert-success">
                    <p>Your image has been uploaded successfully and saved to Azure cloud storage!</p>
                </div>
                <div class="mt-4">
                    <img src="{{ azure_url }}" alt="Uploaded image" class="img-fluid rounded" style="max-height: 400px;">
                </div>
                <div class="mt-3">
                    <p>Filename: {{ filename }}</p>
                    <a href="{{ url_for('main.index') }}" class="btn btn-primary mt-3">Upload Another Image</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
